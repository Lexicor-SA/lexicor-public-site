
name: Lexicor Quality Checks

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, ESLint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
